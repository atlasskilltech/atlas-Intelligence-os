name: Deploy to EC2 Server of atlasliving

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/atlas-Intelligence-os

            git fetch origin main
            git reset --hard origin/main

            npm ci
            npm run build

            pm2 restart atlas-Intelligence-os --update-env || pm2 start npm --name atlas-Intelligence-os -- start
            pm2 save
